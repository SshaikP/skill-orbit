stages:
  - build
  - test
  - docker

# Global variables
variables:
  IMAGE_BACKEND: skillorbit-backend
  IMAGE_FRONTEND: skillorbit-frontend

# Build backend
build_backend:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17

  script:
    - echo "Building backend..."
    - cd user-service
    - mvn clean package -DskipTests

    # Display the filename produced by Maven
    - echo "JAR files generated by Maven:"
    - ls -lh target/*.jar

    # Copy the executable JAR to the filename required by Dockerfile
    - |
      BACKEND_JAR=$(find target -maxdepth 1 -type f -name "*.jar" \
        ! -name "original-*.jar" \
        ! -name "skillorbit-backend.jar" \
        | head -n 1)

      if [ -z "$BACKEND_JAR" ]; then
        echo "ERROR: No backend JAR was generated."
        exit 1
      fi

      echo "Using backend artifact: $BACKEND_JAR"
      cp "$BACKEND_JAR" target/skillorbit-backend.jar

    # Confirm that the exact Docker input exists
    - test -f target/skillorbit-backend.jar
    - ls -lh target/skillorbit-backend.jar

  artifacts:
    paths:
      - user-service/target/skillorbit-backend.jar
    expire_in: 1 hour

# Build frontend
build_frontend:
  stage: build
  image: node:18

  script:
    - echo "Building frontend..."
    - cd skillorbit-ui
    - npm install
    - npm run build

  artifacts:
    paths:
      - skillorbit-ui/build/
    expire_in: 1 hour

# Test backend
test_backend:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17

  script:
    - echo "Running backend tests..."
    - cd user-service
    - mvn test

# Build Docker images
docker_build:
  stage: docker
  image: docker:24.0.5

  services:
    - name: docker:24.0.5-dind

  dependencies:
    - build_backend
    - build_frontend

  script:
    - echo "Verifying downloaded build artifacts..."
    - test -f user-service/target/skillorbit-backend.jar
    - test -d skillorbit-ui/build
    - ls -lh user-service/target/skillorbit-backend.jar
    - ls -la skillorbit-ui/build

    - echo "Building backend Docker image..."
    - docker build -t "$IMAGE_BACKEND" ./user-service

    - echo "Building frontend Docker image..."
    - docker build -t "$IMAGE_FRONTEND" ./skillorbit-ui

    - echo "Docker images built successfully."
    - docker images