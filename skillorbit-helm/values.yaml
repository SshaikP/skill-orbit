frontend:
  image:
    repository: skillorbit-frontend
    tag: v1
    pullPolicy: Never

  service:
    type: NodePort
    port: 80
    nodePort: 30080

backend:

  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  image:
    repository: skillorbit-backend
    tag: v4
    pullPolicy: Never

  service:
    type: ClusterIP
    port: 8080

postgres:
  image:
    repository: postgres
    tag: "15"

  database: careerdb
  username: admin
  password: admin123

  service:
    type: ClusterIP
    port: 5432

  storage:
    size: 1Gi