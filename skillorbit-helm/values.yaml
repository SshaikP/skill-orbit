frontend:
  imagePullSecrets:
    - name: ghcr-secret
  image:
    repository: ghcr.io/sshaikp/skillorbit-frontend
    tag: latest
    pullPolicy: ifNotPresent

  service:
    type: NodePort
    port: 80
    nodePort: 30080

backend:
  imagePullSecrets:
    - name: ghcr-secret

  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  image:
    repository: ghcr.io/sshaikp/skillorbit-backend
    tag: latest
    pullPolicy: ifNotPresent

  service:
    type: ClusterIP
    port: 8080

postgres:
  image:
    repository: postgres
    tag: "15"

  database: careerdb
  username: admin
  password: admin123

  service:
    type: ClusterIP
    port: 5432

  storage:
    size: 1Gi